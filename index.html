<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>jd</title>
    <style>
        /* CSS được sao chép từ tệp output.html mẫu để đảm bảo giao diện giống hệt */
        code{color:#c7254e;background-color:#f9f2f4;border-radius:4px}code,kbd{padding:2px 4px}kbd{color:#fff;background-color:#333;border-radius:3px;box-shadow:inset 0 -1px 0 rgba(0,0,0,.25)}kbd kbd{padding:0;font-size:100%;box-shadow:none}pre{display:block;margin:0 0 10px;word-break:break-all;word-wrap:break-word;color:#333;background-color:#f5f5f5;border:1px solid #ccc;border-radius:4px}pre code{padding:0;font-size:inherit;color:inherit;white-space:pre-wrap;background-color:transparent;border-radius:0}.pre-scrollable{max-height:340px;overflow-y:scroll}table{background-color:transparent}th{text-align:left}.table{width:100%;max-width:100%;margin-bottom:20px}.table>thead>tr>th{padding:8px;line-height:1.4285714;border-top:1px solid #ddd}.table>thead>tr>td,.table>tbody>tr>th,.table>tbody>tr>td,.table>tfoot>tr>th,.table>tfoot>tr>td{padding:8px;line-height:1.4285714;vertical-align:top;border-top:1px solid #ddd}.table>thead>tr>th{vertical-align:bottom;border-bottom:2px solid #ddd}.table>caption+thead>tr:first-child>th,.table>caption+thead>tr:first-child>td,.table>colgroup+thead>tr:first-child>th,.table>colgroup+thead>tr:first-child>td,.table>thead:first-child>tr:first-child>th,.table>thead:first-child>tr:first-child>td{border-top:0}.table>tbody+tbody{border-top:2px solid #ddd}.table .table{background-color:#fff}.table-condensed>thead>tr>th,.table-condensed>thead>tr>td,.table-condensed>tbody>tr>th,.table-condensed>tbody>tr>td,.table-condensed>tfoot>tr>th,.table-condensed>tfoot>tr>td{padding:5px}.table-bordered,.table-bordered>thead>tr>th,.table-bordered>thead>tr>td,.table-bordered>tbody>tr>th,.table-bordered>tbody>tr>td,.table-bordered>tfoot>tr>th,.table-bordered>tfoot>tr>td{border:1px solid #ddd}.table-bordered>thead>tr>th,.table-bordered>thead>tr>td{border-bottom-width:2px}.table-striped>tbody>tr:nth-child(odd)>td,.table-striped>tbody>tr:nth-child(odd)>th{background-color:#f9f9f9}.table-hover>tbody>tr:hover>td,.table-hover>tbody>tr:hover>th{background-color:#f5f5f5}
        
        body{max-width:1024px;margin:0 auto;overflow:auto;padding:2%}
        body{font-family: Arial, Helvetica, sans-serif;}

        /* === BỔ SUNG CSS CHO TABLE ĐỂ CÓ BORDER === */
        table {
            border-collapse: collapse;
            width: 100%;
            margin-bottom: 20px;
        }
        table th, table td {
            border: 1px solid #ddd;
            padding: 8px;
        }
        table th {
             background-color: #f9f9f9;
        }
        table tr:nth-child(odd) td {
            background-color: #f9f9f9;
        }
        blockquote {
        margin: 1em 0; /* Adjust margin as needed */
        padding: 0 1em;
        color: black; /* A slightly darker text color for contrast */
        border-left: 0.25em solid #dfe2e5; /* The prominent left border */
        background-color: #f6f8fa; /* A subtle light gray background */
        }

        /* Optional: Style for paragraphs within the blockquote */
        blockquote p {
            margin-bottom: 0; /* Remove default bottom margin for paragraphs */
            font-size: 0.9em; /* Slightly smaller font size */
            line-height: 1.6; /* Improve readability */
        }
        /* Styling the overall code block container */
        pre {  background-color: #f4f4f4; /* Light gray background */
        padding: 1em; /* Spacing inside the block */
        border-radius: 5px; /* Rounded corners */
        overflow-x: auto; /* Enables horizontal scrolling for long lines */
        font-family: 'Courier New', Courier, monospace; /* Monospaced font */
        line-height: 1.4; /* Adjust line spacing */
        white-space: pre-wrap; /* Preserves whitespace and wraps long lines */
        word-wrap: break-word; /* Prevents overflow of very long words */
        }

        /* Styling the code itself */
        pre code {
        color: #333; /* Darker text color */
        display: block; /* Makes the code occupy its own line within pre */
        /* No need for padding here if already applied to pre */
        }

        /* Specific styling for inline code (e.g., `inline code`) */
        code {
        background-color: #e0e0e0; /* Slightly different background for inline code */
        padding: 0.2em 0.4em; /* Smaller padding for inline code */
        border-radius: 3px;
        font-family: 'Courier New', Courier, monospace;
        }

        #backToTopBtn {
            display: none; /* Ẩn nút theo mặc định */
            position: fixed; /* Giữ nút cố định khi cuộn trang */
            bottom: 20px; /* Cách đáy 20px */
            right: 30px; /* Cách lề phải 30px */
            z-index: 99; /* Đảm bảo nút nổi lên trên các phần tử khác */
            border: none;
            outline: none;
            background-color: #007bff; /* Màu nền */
            color: white; /* Màu chữ */
            cursor: pointer;
            padding: 15px;
            border-radius: 10px; /* Bo tròn góc */
            font-size: 18px;
            transition: background-color 0.3s;
        }

        #backToTopBtn:hover {
            background-color: #eb06e7; /* Màu nền khi di chuột vào */
        }

        /* ----- CSS ĐẶC BIỆT: ẨN NÚT KHI IN ----- */
        @media print {
            #backToTopBtn {
                display: none !important; /* Quan trọng: Ghi đè mọi style khác để ẩn nút đi */
            }
        }

        
    </style>
</head>
<body id="preview">
<button onclick="scrollToTop()" id="backToTopBtn" title="Back to top">↑</button>


<script>
        // Lấy nút bấm
        var mybutton = document.getElementById("backToTopBtn");

        // Khi người dùng cuộn trang xuống 20px từ đầu trang, hiện nút lên
        window.onscroll = function() {
            scrollFunction();
        };

        function scrollFunction() {
            if (document.body.scrollTop > 20 || document.documentElement.scrollTop > 20) {
                mybutton.style.display = "block";
            } else {
                mybutton.style.display = "none";
            }
        }

        // Khi người dùng bấm vào nút, cuộn về đầu trang
        function scrollToTop() {
            document.body.scrollTop = 0; // Cho Safari
            document.documentElement.scrollTop = 0; // Cho Chrome, Firefox, IE và Opera
        }
    </script>
</body>
</html>
